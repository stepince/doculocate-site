<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<radialGradient id="g1" cx="85%" cy="20%" r="70%"><stop offset="0" stop-color="#3f6cf0"/><stop offset="1" stop-color="#182339"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#g1)"/>

<!-- logo -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="bold">
<rect x="60" y="40" width="44" height="44" rx="12" fill="#315bda"/>
<path d="M72 50h13l6 6v7M85 50v6h6M72 50v24h8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="88" cy="71" r="6" fill="#315bda" stroke="#fff" stroke-width="2.6"/><path d="m92.5 75.5 5 5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
<text x="116" y="74" font-size="32" fill="#fff">Docu<tspan fill="#9db6ff">Locate</tspan></text>

<!-- headline -->
<text x="60" y="205" font-size="106" letter-spacing="-3" fill="#fff">ASK THE</text>
<text x="60" y="310" font-size="106" letter-spacing="-3" fill="#8be0a4">WHOLE</text>
<text x="60" y="415" font-size="106" letter-spacing="-3" fill="#fff">DOCUMENT</text>
<text x="64" y="470" font-size="36" fill="#9db6ff">Summaries. Obligations. Risks.</text>
</g>

<!-- bring your own key -->
<g font-family="Arial,Helvetica,sans-serif" font-weight="bold">
<rect x="60" y="548" width="372" height="76" rx="38" fill="#fff"/>
<circle cx="100" cy="586" r="20" fill="#315bda"/>
<path d="M100 573l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#fff"/>
<text x="136" y="596" font-size="30" fill="#182339">Your own AI key</text>
</g>

<!-- stack of pages: the whole document -->
<g filter="url(#sh)">
<rect x="800" y="86" width="400" height="548" rx="20" fill="#dfe6f7"/>
<rect x="780" y="106" width="400" height="548" rx="20" fill="#eef2fb"/>
</g>

<!-- Ask card -->
<g filter="url(#sh)">
<rect x="700" y="130" width="480" height="520" rx="22" fill="#fff"/>
</g>

<!-- Search | Ask control, Ask selected -->
<rect x="740" y="170" width="236" height="56" rx="14" fill="#fff" stroke="#c9d3ea" stroke-width="3"/>
<path d="M754 170h110v56H754a14 14 0 0 1-14-14v-28a14 14 0 0 1 14-14z" fill="#fff"/>
<rect x="856" y="170" width="120" height="56" rx="14" fill="#315bda"/>
<rect x="856" y="170" width="30" height="56" fill="#315bda"/>
<line x1="856" y1="170" x2="856" y2="226" stroke="#c9d3ea" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="26">
<text x="798" y="207" text-anchor="middle" fill="#657186">Search</text>
<text x="916" y="207" text-anchor="middle" fill="#fff">Ask</text>
</g>

<!-- question box -->
<rect x="740" y="252" width="400" height="64" rx="14" fill="#fff" stroke="#315bda" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#182339">
<text x="762" y="293">Summarize this lease</text>
</g>

<!-- AI answer -->
<rect x="740" y="344" width="400" height="260" rx="16" fill="#f4f7fe"/>
<rect x="740" y="344" width="9" height="260" rx="4.5" fill="#2fbf6c"/>
<circle cx="788" cy="386" r="19" fill="#315bda"/>
<path d="M788 373l2.6 7.4 7.4 2.6-7.4 2.6-2.6 7.4-2.6-7.4-7.4-2.6 7.4-2.6z" fill="#fff"/>
<rect x="818" y="378" width="170" height="16" rx="8" fill="#182339"/>
<g fill="#d3dbec">
<rect x="768" y="424" width="350" height="14" rx="7"/>
<rect x="768" y="452" width="350" height="14" rx="7"/>
<rect x="768" y="480" width="300" height="14" rx="7"/>
<rect x="768" y="508" width="350" height="14" rx="7"/>
</g>
<rect x="768" y="546" width="316" height="36" rx="18" fill="#dff6e8"/>
<g font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="19" fill="#237a4b">
<text x="786" y="571">Based on the whole document</text>
</g>
